periodic_verification:
  structures:
    - face-centered cubic
    - body-centered cubic
    - simple cubic
    - diamond
  volume_grid:
    points: 7
    range: 94-106 percent around the reference volume
  equation_of_state: Birch-Murnaghan
  comparisons:
    total_error: CP2K-GTH-UZH vs SIRIUS-FP-LAPW
    basis_error: CP2K-GTH-UZH vs SIRIUS-GTH-UZH
    pseudopotential_error: SIRIUS-GTH-UZH vs SIRIUS-FP-LAPW
  deposited_result_sets:
    cp2k_gth_uzh_original: data/cp2k-gth-uzh/original-settings
    cp2k_gth_uzh_improved_basis: data/cp2k-gth-uzh/improved-basis-settings
    sirius_gth_uzh_original: data/sirius-gth-uzh/original-settings
    sirius_gth_uzh_improved_pseudopotentials: data/sirius-gth-uzh/improved-pseudopotentials
    sirius_fp_lapw_reference: data/sirius-fp-lapw/reference
  focused_checks:
    cp2k_resubmissions: data/cp2k-gth-uzh/resubmissions
    noble_gas_augmented_basis: data/cp2k-gth-uzh/noble-gas-augmented-basis
    pseudopotential_update_comparison: data/sirius-gth-uzh/pseudopotential-update-comparison
    sr_diamond_test: data/sirius-gth-uzh/sr-diamond-test

molecular_calibration:
  properties:
    - bond lengths
    - bond angles
    - dihedral angles
    - dipole moments
    - polarizabilities
    - vibrational frequencies
  basis_sequence:
    - DZVP
    - TZVP
    - TZV2P
