periodic_verification:
  structures:
    - face-centered cubic
    - body-centered cubic
    - simple cubic
    - diamond
  volume_grid:
    points: 7
    range: 94-106 percent around the reference volume
  equation_of_state: Birch-Murnaghan
  comparisons:
    total_error: CP2K-GTH-UZH vs SIRIUS-FP-LAPW
    basis_error: CP2K-GTH-UZH vs SIRIUS-GTH-UZH
    pseudopotential_error: SIRIUS-GTH-UZH vs SIRIUS-FP-LAPW
  deposited_result_sets:
    cp2k_gth_uzh_original: data/cp2k-gth-uzh/original-settings
    cp2k_gth_uzh_improved_basis: data/cp2k-gth-uzh/improved-basis-settings
    sirius_gth_uzh_original: data/sirius-gth-uzh/original-settings
    sirius_gth_uzh_improved_pseudopotentials: data/sirius-gth-uzh/improved-pseudopotentials
    sirius_fp_lapw_reference: data/sirius-fp-lapw/reference
  focused_checks:
    cp2k_resubmissions: data/cp2k-gth-uzh/resubmissions
    noble_gas_augmented_basis: data/cp2k-gth-uzh/noble-gas-augmented-basis
    pseudopotential_update_comparison: data/sirius-gth-uzh/pseudopotential-update-comparison
    sr_diamond_test: data/sirius-gth-uzh/sr-diamond-test
  postprocessing:
    acwf_upstream_scripts: scripts/acwf-verification/upstream
    uzh_epsilon_tables_script: scripts/epsilon/compute_uzh_epsilon_tables.py
    derived_tables: data/derived-epsilon-tables

molecular_calibration:
  source_record: Zenodo record 7841955
  deposited_data:
    structures: data/molecular-calibration/structures/small-molecule-database
    gaussian16_inputs: data/molecular-calibration/gaussian16/inputs
    gaussian16_logs: data/molecular-calibration/gaussian16/logs
    cp2k_inputs: data/molecular-calibration/cp2k/inputs
    cp2k_optimized_structures: data/molecular-calibration/cp2k/optimized-structures
    cp2k_run_scripts: data/molecular-calibration/cp2k/run-scripts
    parsed_summaries: data/molecular-calibration/summaries
  properties:
    - bond lengths
    - bond angles
    - dihedral angles
    - dipole moments
    - polarizabilities
    - vibrational frequencies
  basis_sequence:
    - DZVP
    - TZVP
    - TZV2P
  all_electron_gapw_basis_sequence:
    - SVP
    - TZVPP
    - QZVPP
  functionals:
    - PBE
    - PBE0
    - TPSS
